services:
  - type: web
    name: floodlens-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EARTH_ENGINE_PROJECT
        sync: false
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FLOODLENS_CORS_ALLOW_ORIGINS
        sync: false
      - key: FLOODLENS_ENABLE_SCHEDULER
        value: "true"
      - key: FLOODLENS_RISK_REFRESH_INTERVAL_HOURS
        value: "12"
